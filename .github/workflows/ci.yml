# CI: every change is tested before it reaches develop or master.
# Runs on pushes to develop and on pull requests into develop/master (feature, release and hotfix branches
# are tested through their pull request); CD calls it too, so master and release tags are never published
# untested. No API keys: the tests use fakes, and the Docker smoke test runs the real image with the fake
# LLM (LLM_PROVIDER=fake), so CI costs nothing.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going. github.workflow is the caller's name when CD
# calls this file, so CD's run never cancels (or is cancelled by) a CI run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  lint:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Same pinned ruff as locally; the rules are in pyproject.toml.
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format github .
      # Known CVEs in the pinned packages. It can fail without a code change when a new CVE is published:
      # that is the point, since every commit on master becomes an image.
      - run: pip-audit -r requirements-dev.txt --progress-spinner off

  semgrep:
    name: Semgrep (static security analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The official image: nothing added to the project's dependencies, no account or token (public rulesets).
    container: semgrep/semgrep:1.160.0
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --error --metrics off
          --config p/python --config p/fastapi --config p/secrets --config p/dockerfile
          --exclude venv --exclude evals/results --exclude logs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t weroad-chat:ci .
      - name: Smoke test (fake LLM, no API keys)
        run: |
          docker run -d --name app -p 8000:8000 \
            -e LLM_PROVIDER=fake -e FAKE_LLM_LATENCY_S=0 -e FAQ_RETRIEVER=index weroad-chat:ci
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:8000/api/ready | grep -q '"assistant_ready":true' && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/ready | grep -q '"assistant_ready":true'
          curl -fs http://127.0.0.1:8000/ > /dev/null
          curl -fs -X POST http://127.0.0.1:8000/api/search -H 'Content-Type: application/json' -d '{}' | grep -q '"total"'
          curl -fs -X POST http://127.0.0.1:8000/api/chat -H 'Content-Type: application/json' \
            -d '{"message":"somewhere in Asia"}' | grep -q '"session_id"'
          echo "page, search and chat answered"
      - name: Container log
        if: always()
        run: docker logs app || true
