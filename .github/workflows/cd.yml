# CD: what reaches master, and every release tag, is published as a Docker image on GitHub's registry.
#   push to master   -> ghcr.io/<owner>/weroad-chat:latest and :sha-<commit>
#   tag v1.2.3       -> :1.2.3 and :1.2 (the Git Flow release, see CLAUDE.md "Branches")
#   PR into master   -> the image is built but not pushed: the code isn't merged yet, so publishing it would
#                       let `latest` point at code that may never reach master. The build proves it will publish.
# CI runs first in the same workflow: nothing untested is published. Deploying the image to a server is the
# next step and depends on where it runs (see DECISION.md).
name: CD

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Publishing runs one at a time per ref and is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # On a pull request the CI workflow already runs (it triggers on PRs into master): don't test twice.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: ci
    # Runs after CI passed, or when CI was skipped on a pull request; never after a failed CI.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the workflow's own token, no stored secret
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/weroad-chat
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version on every Langfuse trace from this image (there is no git inside it).
          build-args: RELEASE=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
